site_name: nextSSR Documentation
site_description: Next-generation High-Performance & FAIR-compliant Simple Sequence Repeat (SSR) Platform
site_author: Fabiano Menegidio
site_url: https://LaBiOmicS.github.io/nextSSR/

repo_url: https://github.com/LaBiOmicS/nextSSR
repo_name: LaBiOmicS/nextSSR

docs_dir: docs_src
site_dir: docs_build

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true
            show_category_heading: true
            group_by_category: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Quick Start: quickstart.md
  - Python API Reference:
      - API Overview: api/index.md
      - SSRFinder: api/finder.md
      - PrimerDesigner: api/primer.md
      - EPCRSimulator: api/epcr.md
      - SSRConfig: api/config.md
      - Data Models: api/models.md
      - CompoundSSR: api/compound.md
      - FAIR Provenance: api/provenance.md
      - Output Exporters: api/exporters.md
  - CLI Reference: cli.md
  - FAIR & RO-Crate: fair.md
