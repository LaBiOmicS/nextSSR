name: Containers / Docker & Apptainer Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-push:
    name: Build & Push Docker Container to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apptainer-build:
    name: Build Apptainer (Singularity) .sif Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Apptainer / Singularity
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: '1.2.5'

      - name: Build Apptainer .sif Image
        run: |
          apptainer build nextssr.sif Apptainer.def

      - name: Test Apptainer Container Execution
        run: |
          apptainer run nextssr.sif --help

      - name: Upload Apptainer Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextssr-apptainer-sif
          path: nextssr.sif
