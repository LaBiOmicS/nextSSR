name: CI / Unit Tests & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Formatting & Type Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy

      - name: Run Black Formatting Check
        run: |
          black --check nextssr/ tests/

      - name: Run Flake8 Linting
        run: |
          flake8 nextssr/ tests/ --count --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Mypy Static Type Analysis
        run: |
          mypy nextssr/ --ignore-missing-imports

  unit-tests:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint-and-format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=nextssr --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: coverage.xml
