name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p nextssr-wasm --target wasm32-unknown-unknown -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: ./scripts/build-web.sh
      - name: WebAssembly output equals CLI output
        run: |
          cargo build --release -p nextssr
          node scripts/wasm_check.mjs tests/data/tricky.fasta '{"imperfect":true,"primers":true,"num_pairs":3,"epcr":true}' /tmp/w
          ./target/release/nextssr run tests/data/tricky.fasta -o /tmp/c --imperfect --primers --num-pairs 3 --epcr -f tsv,gff3,misa,statistics,bed,p3in -q
          for f in tsv gff3 misa statistics bed p3in primers.tsv epcr.tsv; do cmp /tmp/w.$f /tmp/c.$f; done
