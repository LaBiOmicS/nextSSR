name: PyPI Package Build & Release Pipeline

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build Distribution & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publisher (OIDC)
      contents: write  # Allows attaching assets to GitHub Release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build & Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Source Distribution and Wheel
        run: |
          python -m build

      - name: Verify Package Integrity with Twine
        run: |
          twine check dist/*

      - name: Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
