name: Security Audit & CodeQL Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Run weekly on Mondays

jobs:
  codeql:
    name: CodeQL Semantic Code Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-scan:
    name: Dependency & Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Project & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install bandit pip-audit

      - name: Run Bandit (Python Static Security Analysis)
        run: |
          bandit -r nextssr/ -ll -ii

      - name: Run pip-audit (Vulnerability Scan)
        run: |
          pip-audit --local
