<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nextSSR — Pyodide Wasm Engine</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body style="font-family: system-ui, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto;">
  <h1 style="color: #22c55e;">nextSSR 🚀 Pyodide WebAssembly Engine</h1>
  <div id="status-box" style="background-color: #1e293b; padding: 1.5rem; border-radius: 0.75rem; border: 1px solid #334155; margin-top: 1rem;">
    <h3 style="margin-top: 0;">Engine Status:</h3>
    <p id="status-text" style="font-family: monospace; color: #fbbf24;">Initializing Pyodide WebAssembly engine...</p>
  </div>

  <script>
    async function main() {
      const statusText = document.getElementById("status-text");
      try {
        statusText.innerText = "Downloading Pyodide WebAssembly binaries (~6 MB)...";
        let pyodide = await loadPyodide();
        
        statusText.innerText = "Pyodide Wasm Loaded! Compiling CPython test...";
        let pyVersion = await pyodide.runPythonAsync("import sys; sys.version");
        
        statusText.style.color = "#22c55e";
        statusText.innerHTML = "✓ <strong>Pyodide Engine Ready!</strong><br>Python Version: " + pyVersion;
      } catch (err) {
        statusText.style.color = "#f87171";
        statusText.innerText = "❌ Pyodide Load Error: " + err.message;
      }
    }

    main();
  </script>
</body>
</html>
