[package]
name = "nextssr"
description = "nextSSR: fast, MISA-compatible microsatellite (SSR) finder with imperfect/compound SSRs and primer design"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "nextssr"

[[bin]]
name = "nextssr"
path = "src/main.rs"

[dependencies]
nextssr-core = { workspace = true, features = ["parallel"] }
serde_json.workspace = true
clap = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow = "1"
flate2 = "1"
rayon = "1.10"
sha2 = "0.10"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
serde_json = "1"
